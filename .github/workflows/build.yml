name: Build

on:
  push:
  pull_request:

permissions:
  contents: write

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # Caches ~/.gradle, where Loom keeps the remapped Minecraft jar.
      # Without it every run re-downloads and re-remaps it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build

      - name: Upload mod jar
        uses: actions/upload-artifact@v7
        with:
          name: tinman
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      # Pushing a tag like v1.0.0 additionally attaches the jar to a GitHub release.
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/libs/*.jar
